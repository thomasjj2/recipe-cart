<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recipe → Cart</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf6ee;--ink:#241c12;--mute:#7a6f5c;--line:#e4d8c3;--card:#fff;--accent:#d9631e;--good:#3f7a4b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Bricolage Grotesque",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:560px;margin:0 auto;padding:20px 18px 70px}
h1{font-size:2.1rem;line-height:1.05;font-weight:800;margin:22px 0 4px;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
textarea{width:100%;min-height:120px;padding:12px;border:1.5px solid var(--line);border-radius:8px;font:inherit;resize:vertical}
input[type=text]{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:8px;font:inherit}
label{display:block;font-weight:600;font-size:.9rem;margin:10px 0 4px}
.btn{padding:13px 16px;border:0;border-radius:8px;background:var(--ink);color:#fff;font:600 1rem inherit;font-family:inherit;cursor:pointer}
.btn.primary{background:var(--accent)}
.btn:disabled{opacity:.5}
.btn.block{width:100%}
#signin{position:fixed;top:0;left:0;right:0;background:var(--ink);color:#fff;padding:9px 14px;font-size:.85rem;display:flex;justify-content:space-between;align-items:center;z-index:5}
#signin button{background:none;border:1px solid #fff5;color:#fff;border-radius:6px;padding:5px 10px;font:inherit;cursor:pointer}
.item{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.item img{width:44px;height:44px;object-fit:contain;border-radius:6px;background:#f4ede0}
.item .info{flex:1;min-width:0}
.item .info b{display:block;font-size:.95rem}
.item .info small{color:var(--mute)}
.item .price{font-weight:700;white-space:nowrap}
.item.missing{opacity:.55}
.banner{padding:10px 12px;border-radius:8px;margin-bottom:14px;font-size:.9rem}
.banner.ok{background:#e8f3ea;color:var(--good)}
.banner.err{background:#fbe9e4;color:#a8341c}
.total{display:flex;justify-content:space-between;font-weight:700;padding:12px 0 4px;font-size:1.1rem}
small.note{color:var(--mute)}
:focus-visible{outline:3px solid #f2c230;outline-offset:2px}
</style></head><body>
<div id="signin"><span id="who">Not signed in</span><button id="signbtn">Sign in</button></div>
<main style="padding-top:44px">
<h1>Recipe → Cart</h1>
<p class="sub">Paste a recipe or meal plan. Get real Kroger prices and send it straight to your cart.</p>

<div id="banner"></div>

<div class="card">
  <label for="recipe">Recipe or meal plan text</label>
  <textarea id="recipe" placeholder="Paste a recipe here, e.g. ingredients for chicken stir fry..."></textarea>
  <label for="zip">ZIP code (for local pricing &amp; store)</label>
  <input id="zip" type="text" inputmode="numeric" placeholder="31088">
  <button class="btn primary block" id="go" style="margin-top:12px">Build shopping list</button>
</div>

<div id="list"></div>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

// TODO: paste your Firebase web config (Project settings > Your apps)
const firebaseConfig = { apiKey:"", authDomain:"", projectId:"", appId:"" };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
let user = null, matched = null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const money = (n) => (n == null ? null : "$" + Number(n).toFixed(2));

onAuthStateChanged(auth, (u) => {
  user = u;
  $("who").textContent = u ? `Signed in as ${u.email || u.displayName || "you"}` : "Not signed in";
  $("signbtn").textContent = u ? "Sign out" : "Sign in";
});
$("signbtn").onclick = () => (user ? signOut(auth) : signInWithPopup(auth, new GoogleAuthProvider()));

// Handle redirect back from Kroger consent
const qs = new URLSearchParams(location.search);
if (qs.get("kroger_connected")) banner("ok", "Kroger connected. You can now send items to your cart.");
if (qs.get("kroger_denied")) banner("err", "Kroger connection was cancelled.");
if (qs.get("kroger_error")) banner("err", "Something went wrong connecting to Kroger. Try again.");
if (qs.toString()) history.replaceState({}, "", location.pathname);

function banner(kind, msg) { $("banner").innerHTML = `<div class="banner ${kind}">${esc(msg)}</div>`; }

$("go").onclick = async () => {
  const text = $("recipe").value.trim();
  if (!text) return banner("err", "Paste a recipe first.");
  $("go").disabled = true; $("list").innerHTML = "<p>Reading the recipe…</p>";
  try {
    const parsed = await postJSON("/.netlify/functions/parse-recipe", { text });
    $("list").innerHTML = "<p>Looking up prices near you…</p>";
    matched = await postJSON("/.netlify/functions/match-products", { ingredients: parsed.ingredients, zip: $("zip").value.trim() });
    renderList(parsed.title, matched.items);
  } catch (e) { banner("err", e.message || "Something went wrong."); $("list").innerHTML = ""; }
  $("go").disabled = false;
};

function renderList(title, items) {
  const total = items.reduce((s, i) => s + (i.product?.promoPrice || i.product?.price || 0), 0);
  const rows = items.map((i, idx) => {
    const p = i.product;
    return `<div class="item ${p ? "" : "missing"}">
      ${p?.image ? `<img src="${esc(p.image)}" alt="">` : `<div class="item img" style="width:44px;height:44px"></div>`}
      <div class="info"><b>${esc(p?.description || i.name)}</b><small>${esc(i.qty)}${p?.size ? " · " + esc(p.size) : ""}</small></div>
      <div class="price">${p ? (money(p.promoPrice) || money(p.price) || "n/a") : "not found"}</div>
    </div>`;
  }).join("");
  $("list").innerHTML = `
    <div class="card"><b>${esc(title || "Shopping list")}</b>
      ${rows}
      <div class="total"><span>Estimated total</span><span>${money(total)}</span></div>
      <small class="note">Prices are live estimates from Kroger and can differ at checkout.</small>
      <button class="btn block" id="sendCart" style="margin-top:12px">Send to my Kroger cart</button>
    </div>`;
  $("sendCart").onclick = sendToCart;
}

async function sendToCart() {
  if (!user) { banner("err", "Sign in first."); return; }
  const idToken = await user.getIdToken();
  const items = matched.items.filter((i) => i.product?.upc).map((i) => ({ upc: i.product.upc, quantity: 1 }));
  if (!items.length) return banner("err", "No matched items to add.");
  try {
    const r = await postJSON("/.netlify/functions/cart-add", { idToken, items });
    banner("ok", `Added ${r.added} items to your Kroger cart.`);
  } catch (e) {
    if (e.message === "not_connected") {
      location.href = `/.netlify/functions/kroger-auth-start?idToken=${encodeURIComponent(idToken)}`;
    } else banner("err", e.message || "Could not add to cart.");
  }
}

async function postJSON(url, body) {
  const r = await fetch(url, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || "Request failed");
  return d;
}
</script></body></html>
